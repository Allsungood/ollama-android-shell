name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      snapshot_url_template:
        description: '快照下载 URL 模板（磁盘名 {arch}）——供 arm64/x86_64 各自下载'
        default: 'https://example.com/snapshots/termux-runtime-{arch}.tar.xz'
        required: false

permissions:
  contents: write

env:
  SNAPSHOT_HOST: ${{ github.event.inputs.snapshot_url_template || 'https://github.com/ollamadeck-demo/snapshots/releases/download/latest/termux-runtime-{arch}.tar.xz' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64, x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Android SDK：cmdline-tools + 平台 + build-tools（AGP 8.9.2 / compileSdk 36）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "latest"

      - name: 获取 Termux 运行时快照（${{ matrix.abi }}）
        run: |
          mkdir -p out/snapshot
          url="${SNAPSHOT_HOST//\{arch\}/${{ matrix.abi }}}"
          curl -fL "$url" -o "out/snapshot/termux-runtime-${{ matrix.abi }}.tar.xz" \
            || { echo "::warning::快照下载失败（$url），跳过本次构建"; exit 0; }
          ls -lh "out/snapshot/termux-runtime-${{ matrix.abi }}.tar.xz"

      - name: 构建 APK（${{ matrix.abi }}）
        run: node scripts/build-apk.mjs --arch ${{ matrix.abi }}

      - name: 计算 SHA-256
        id: shasum
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          sha256sum "$apk" | tee .apk.sha256
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: 上传 APK 产物（${{ matrix.abi }}）
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-apk-${{ matrix.abi }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            .apk.sha256
          if-no-files-found: error

  # 汇总并发布到 tag 的 release（snapshot 与 APK 双 ABI）
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-mobile-apk-arm64
          path: out/arm64
      - uses: actions/download-artifact@v4
        with:
          name: dsh-mobile-apk-x86_64
          path: out/x86_64
      - name: 上传到 Release
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            out/arm64/*.apk out/arm64/*.sha256 \
            out/x86_64/*.apk out/x86_64/*.sha256 \
            --clobber || echo "::warning::上传失败（可能 Release 不存在）"