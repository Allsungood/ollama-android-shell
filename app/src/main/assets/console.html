<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ollama Deck · 控制台</title>
<style>
  body { background:#0f1117; color:#e6e9ef; font-family:monospace; margin:0; padding:16px; }
  #out { white-space:pre-wrap; line-height:1.5; font-size:13px; }
  form { position:fixed; bottom:0; left:0; right:0; display:flex; background:#151823; padding:8px; gap:8px; }
  input { flex:1; background:#0f1117; color:#e6e9ef; border:1px solid #2a3352; border-radius:8px; padding:10px; }
  button { background:#0b8a6f; color:#fff; border:0; border-radius:8px; padding:10px 16px; }
</style>
</head>
<body>
<pre id="out">Ollama Deck 内置控制台（Termux bash，诊断用）
</pre>
<form onsubmit="run(event)">
  <input id="cmd" placeholder="输入命令，例如 ollama list" autofocus>
  <button type="submit">执行</button>
</form>
<script>
  const out = document.getElementById('out');
  async function run(ev) {
    ev.preventDefault();
    const cmd = document.getElementById('cmd').value;
    out.textContent += '> ' + cmd + '\n';
    document.getElementById('cmd').value = '';
    try {
      const r = await fetch('http://127.0.0.1:11434/api/version');
      if (r.ok) out.textContent += 'ollama: ' + (await r.text()) + '\n';
      else out.textContent += 'ollama 未就绪\n';
    } catch (e) { out.textContent += 'ollama 未就绪: ' + e.message + '\n'; }
  }
</script>
</body>
</html>
